<style>
    .invoice.measuring {
        display: block !important;
        min-height: 0 !important;
        height: auto !important;
    }
    .invoice.measuring .footer,
    .invoice.measuring .inv-footer {
        margin-top: 0 !important;
    }
    .invoice.measuring .footer-spacer {
        display: none !important;
    }

    .invoice.pdf-mode {
        display: block;
    }
    .invoice.pdf-mode .footer-spacer {
        display: none !important;
    }
    .invoice.pdf-mode.multi-page .footer,
    .invoice.pdf-mode.multi-page .inv-footer {
        margin-top: var(--pdf-footer-push, 0px) !important;
        break-inside: avoid;
        page-break-inside: avoid;
    }
    .invoice.pdf-mode.multi-page .services-table thead,
    .invoice.pdf-mode.multi-page .inv-table thead {
        display: table-header-group;
    }
    .invoice.pdf-mode.multi-page tr,
    .invoice.pdf-mode.multi-page .signature-section,
    .invoice.pdf-mode.multi-page .inv-lower,
    .invoice.pdf-mode.multi-page .inv-words,
    .invoice.pdf-mode.multi-page .summary-section {
        break-inside: avoid;
        page-break-inside: avoid;
    }

    .invoice.pdf-compact {
        padding: 8mm 10mm !important;
        font-size: 10px !important;
    }
    .pdf-compact .services-table th,
    .pdf-compact .inv-table th {
        padding: 3px 3px !important;
        font-size: 9px !important;
    }
    .pdf-compact .services-table td,
    .pdf-compact .inv-table td {
        padding: 1px 3px !important;
    }
    .pdf-compact textarea {
        font-size: 9px !important;
        line-height: 1.15 !important;
        min-height: 16px !important;
    }
    .pdf-compact input {
        font-size: 9px !important;
        padding: 0 1px !important;
    }
    .pdf-compact .sig-space {
        height: 34px !important;
    }
    .pdf-compact .footer,
    .pdf-compact .inv-footer {
        font-size: 8px !important;
        line-height: 1.3 !important;
        padding-top: 5px !important;
    }
    .pdf-compact .inv-header,
    .pdf-compact .inv-title-row {
        margin-bottom: 6px !important;
    }

    @media print {
        .invoice.pdf-mode .footer-spacer {
            display: none !important;
        }
        .invoice.pdf-mode.multi-page .footer,
        .invoice.pdf-mode.multi-page .inv-footer {
            margin-top: var(--pdf-footer-push, 0px) !important;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .invoice.pdf-mode.multi-page tr,
        .invoice.pdf-mode.multi-page .signature-section,
        .invoice.pdf-mode.multi-page .inv-lower,
        .invoice.pdf-mode.multi-page .inv-words,
        .invoice.pdf-mode.multi-page .summary-section {
            break-inside: avoid;
            page-break-inside: avoid;
        }
    }
</style>
<script>
(function () {
    var A4_HEIGHT_PX = 1122;
    var TOLERANCE = 8;
    var FOOTER_SAFE_GAP = 12;
    var FOOTER_LAYOUT_ADJUST = 50;

    function measure(el, compact) {
        var clone = el.cloneNode(true);
        clone.classList.remove('pdf-mode', 'multi-page');
        clone.classList.toggle('pdf-compact', !!compact);
        clone.classList.add('measuring');
        document.body.appendChild(clone);

        var rect = clone.getBoundingClientRect();
        var footer = clone.querySelector('.inv-footer, .footer');
        if (!footer) {
            document.body.removeChild(clone);
            return rect.height;
        }
        var contentHeight = footer.getBoundingClientRect().top - rect.top;
        var footerHeight = footer.offsetHeight;
        var bottomPadding = parseFloat(window.getComputedStyle(clone).paddingBottom) || 0;
        var total = contentHeight + footerHeight + bottomPadding;

        document.body.removeChild(clone);
        return total;
    }

    function updateDocumentPagination() {
        var el = document.querySelector('.invoice');
        if (!el) return;

        el.classList.add('pdf-mode');
        el.style.removeProperty('--pdf-footer-push');
        var natural = measure(el, false);
        var useCompact = natural > A4_HEIGHT_PX + TOLERANCE;
        var total = useCompact ? measure(el, true) : natural;

        el.classList.toggle('pdf-compact', useCompact);

        var pageCount = total <= A4_HEIGHT_PX + TOLERANCE
            ? 1
            : Math.ceil((total - TOLERANCE) / A4_HEIGHT_PX);
        var forcedPages = parseInt(el.dataset.forcePages || '0', 10) || 0;
        pageCount = Math.max(1, forcedPages, pageCount);

        el.classList.toggle('multi-page', pageCount > 1);
        var preparedHeight = pageCount > 1
            ? Math.max(0, pageCount * A4_HEIGHT_PX - FOOTER_SAFE_GAP - FOOTER_LAYOUT_ADJUST)
            : 0;
        el.style.minHeight = pageCount > 1 ? preparedHeight + 'px' : '';

        var footer = el.querySelector('.inv-footer, .footer');
        if (pageCount > 1 && footer) {
            var bottomPadding = parseFloat(window.getComputedStyle(el).paddingBottom) || 0;
            var targetTop = preparedHeight - footer.offsetHeight - bottomPadding;
            var currentTop = footer.getBoundingClientRect().top - el.getBoundingClientRect().top;
            var push = Math.max(0, targetTop - currentTop);
            el.style.setProperty('--pdf-footer-push', Math.round(push) + 'px');
        }
    }

    function restoreDocumentPagination() {
        var el = document.querySelector('.invoice');
        if (!el) return;
        el.classList.remove('pdf-mode', 'pdf-compact', 'multi-page');
        el.style.removeProperty('--pdf-footer-push');
        el.style.minHeight = '';
    }

    window.updateDocumentPagination = updateDocumentPagination;
    window.preparePdf = updateDocumentPagination;
    window.restorePdf = restoreDocumentPagination;

    document.addEventListener('beforeprint', updateDocumentPagination);
    document.addEventListener('afterprint', restoreDocumentPagination);
})();
</script>
