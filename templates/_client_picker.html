<style>
    .client-picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 auto 14px; max-width: 210mm; padding: 12px 14px; background: #f0f7ff; border: 1px solid #bfdbfe; border-radius: 10px; font-family: Arial, sans-serif; font-size: 13px; }
    .client-picker label { font-weight: bold; color: #1e3a5f; }
    .client-picker select { flex: 1; min-width: 220px; padding: 9px 12px; border: 1px solid #93c5fd; border-radius: 7px; font: inherit; background: #fff; }
    .client-picker a { font-size: 12px; color: #1d4ed8; }
    @media print { .client-picker { display: none !important; } }
</style>
{% if not inline_picker %}
<div class="client-picker no-print">
    <label for="client-picker-select">&#128100; Client</label>
    <select id="client-picker-select" onchange="pickClient(this.value)">
        <option value="">— Choisir un client existant (ou saisir un nouveau ci-dessous) —</option>
    </select>
    <a href="/clients">Gérer les clients</a>
</div>
{% endif %}
<script>
(function () {
    var CLIENTS = [];
    // client field -> ids of the inputs it fills (whichever exist on the page)
    var MAP = {
        name:    ['client-doit', 'client-raison', 'client-adresse-a'],
        contact: ['client-nom'],
        code:    ['client-code'], address: ['client-adresse'],
        rc: ['client-rc'], nif: ['client-nif'], nis: ['client-nis'], ai: ['client-ai'],
        art: ['client-art'], email: ['client-email'], tel: ['client-tel']
    };
    // Bons de commande / versement: the name goes in "client-nom"

    fetch('/api/clients').then(function (r) { return r.ok ? r.json() : []; }).then(function (list) {
        CLIENTS = list;
        var sel = document.getElementById('client-picker-select');
        list.forEach(function (c) {
            var o = document.createElement('option');
            o.value = c.id; o.textContent = c.name + (c.code ? ' (' + c.code + ')' : '');
            sel.appendChild(o);
        });
    }).catch(function () {});

    function setVal(id, v) {
        var el = document.getElementById(id);
        if (!el) return;
        el.value = v || '';
        el.dispatchEvent(new Event('input', { bubbles: true }));
        el.dispatchEvent(new Event('change', { bubbles: true }));
    }

    window.pickClient = function (id) {
        var NAME_IN_NOM = !document.getElementById('client-doit') && !document.getElementById('client-raison');
        var c = CLIENTS.filter(function (x) { return String(x.id) === String(id); })[0];
        if (!c) return;
        Object.keys(MAP).forEach(function (k) {
            MAP[k].forEach(function (el) {
                if (k === 'contact' && NAME_IN_NOM) return;
                setVal(el, c[k]);
            });
        });
        if (NAME_IN_NOM) setVal('client-nom', c.name);
    };
})();
</script>
