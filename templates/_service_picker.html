<style>
    .service-picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 auto 14px; max-width: 210mm; padding: 12px 14px; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 10px; font-family: Arial, sans-serif; font-size: 13px; }
    .service-picker label { font-weight: bold; color: #4c1d95; }
    .service-picker select { flex: 1; min-width: 240px; padding: 9px 12px; border: 1px solid #c4b5fd; border-radius: 7px; font: inherit; background: #fff; }
    .service-picker input { flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid #c4b5fd; border-radius: 7px; font: inherit; background: #fff; outline: none; }
    .service-picker input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.12); }
    .service-picker a { font-size: 12px; color: #6d28d9; }
    @media print { .service-picker { display: none !important; } }
</style>
<div class="service-picker no-print" id="service-picker" {% if readonly and not (auto_edit | default(false)) %}style="display:none"{% endif %}>
    <label for="service-picker-select">&#128295; Service</label>
    <input id="service-picker-filter" type="search" placeholder="Filtrer un service (nom ou référence)…" oninput="filterServiceOptions()" aria-label="Filtrer les services">
    <select id="service-picker-select" onchange="pickService(this.value)">
        <option value="">— Choisir un service du catalogue (ajoute une ligne) —</option>
    </select>
    <a href="/services">Gérer les services</a>
</div>
<script>
(function () {
    var SERVICES = [];
    var sel = document.getElementById('service-picker-select');
    if (!sel) return;

    fetch('/api/services').then(function (r) { return r.ok ? r.json() : []; }).then(function (list) {
        SERVICES = list;
        list.forEach(function (s) {
            var o = document.createElement('option');
            o.value = s.id;
            o.dataset.search = ((s.reference || '') + ' ' + (s.name || '')).toLowerCase();
            o.textContent = (s.reference ? '[' + s.reference + '] ' : '')
                + s.name
                + (s.price ? ' — ' + Number(s.price).toFixed(2) + ' DA' : '');
            sel.appendChild(o);
        });
        filterServiceOptions();
    }).catch(function () {});

    window.filterServiceOptions = function () {
        var input = document.getElementById('service-picker-filter');
        if (!input || !sel) return;
        var q = (input.value || '').trim().toLowerCase();
        Array.prototype.slice.call(sel.options).forEach(function (o) {
            if (!o.value) return;
            var match = !q || (o.dataset.search || o.textContent.toLowerCase()).indexOf(q) !== -1;
            o.hidden = !match;
            o.disabled = !match;
        });
        if (sel.selectedIndex > 0 && sel.options[sel.selectedIndex].hidden) sel.value = '';
    };

    window.pickService = function (id) {
        var s = SERVICES.filter(function (x) { return String(x.id) === String(id); })[0];
        if (!s) return;
        if (typeof window.addServiceToDocument === 'function') {
            window.addServiceToDocument(s);
        }
        sel.value = '';
    };
})();
</script>
